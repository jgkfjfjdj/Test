# Local development stack.
#   docker compose -f infra/compose/docker-compose.dev.yml up -d            # postgres + redis
#   docker compose -f infra/compose/docker-compose.dev.yml --profile api up -d --build   # + API container
name: kindling-dev

services:
  postgres:
    image: postgres:17-alpine
    command:
      [
        'postgres',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
        '-c',
        'log_min_duration_statement=200',
      ]
    environment:
      POSTGRES_USER: kindling
      POSTGRES_PASSWORD: kindling
      POSTGRES_DB: kindling
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kindling -d kindling']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ['api']
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    image: kindling-api:dev
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: postgres://kindling:kindling@postgres:5432/kindling
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ['api']
    image: kindling-api:dev
    environment:
      # The image defaults to production mode, which requires real keys/secrets. This local stack runs
      # in development mode (ephemeral signing keys, public dev secrets, http cookies).
      NODE_ENV: development
      APP_ENV: local
      LOG_LEVEL: info
      DATABASE_URL: postgres://kindling:kindling@postgres:5432/kindling
      REDIS_URL: redis://redis:6379/0
      ADMIN_COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
