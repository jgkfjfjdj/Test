name: ci-unity

# Compiles the Unity project, runs EditMode tests and builds the Linux dedicated server with GameCI.
# Requires (repository secrets): UNITY_LICENSE (Personal: contents of the .ulf file) plus UNITY_EMAIL
# and UNITY_PASSWORD — or UNITY_SERIAL for Pro. See https://game.ci/docs/github/activation
# Skips with a notice until game/ProjectSettings is committed and a license secret exists.

on:
  push:
    paths: ['game/**', '.github/workflows/ci-unity.yml']
  pull_request:
    paths: ['game/**', '.github/workflows/ci-unity.yml']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '' }}
        run: |
          if [ ! -f game/ProjectSettings/ProjectVersion.txt ]; then
            echo "::notice::game/ProjectSettings is not committed yet (open the project once in Unity — see game/README.md). Unity CI skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "::notice::No Unity license secret (UNITY_LICENSE or UNITY_SERIAL). Unity CI skipped."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  editmode-tests:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-test-${{ hashFiles('game/Packages/packages-lock.json', 'game/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: game
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity EditMode tests

  linux-server-build:
    needs: [preflight, editmode-tests]
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-server-${{ hashFiles('game/Packages/packages-lock.json', 'game/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-server-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: game
          targetPlatform: StandaloneLinux64
          buildName: KindlingServer
          buildMethod: Kindling.Editor.Build.KindlingBuild.CiBuildLinuxServer
      - uses: actions/upload-artifact@v4
        with:
          name: kindling-server-linux
          path: build/StandaloneLinux64
          retention-days: 7
