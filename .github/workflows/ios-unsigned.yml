name: ios-unsigned

# Builds an UNSIGNED iPhone app (.ipa) to install yourself with a free Apple ID — no Apple Developer
# Program membership needed. Only the Unity secrets are required.
#   1. Unity (Linux runner, GameCI) exports the Xcode project.
#   2. A macOS runner compiles it with code signing turned off and packages Kindling-unsigned.ipa.
# You then sign and install it with Sideloadly or AltStore (or Xcode on a Mac) using your own Apple ID:
# docs/guides/ios-sideload.md. Run it from GitHub → Actions → ios-unsigned → "Run workflow".

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version shown in the app (CFBundleShortVersionString)'
        default: '0.1.0'
        required: true

permissions:
  contents: read

concurrency:
  group: ios-unsigned
  cancel-in-progress: false

env:
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  preflight:
    name: Check Unity secrets
    runs-on: ubuntu-latest
    steps:
      - name: Secrets checklist
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          missing=0
          {
            echo "## Unsigned iPhone build: prerequisites"
            echo ""
            echo "| Secret | Purpose | Status |"
            echo "|--------|---------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          row() { # name purpose value
            if [ -n "$3" ]; then status="✅ set"; else status="❌ missing"; missing=$((missing+1)); echo "::error title=Missing secret::$1 — $2"; fi
            echo "| \`$1\` | $2 | $status |" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ -n "$UNITY_SERIAL" ]; then
            row UNITY_SERIAL "Unity Pro serial" "$UNITY_SERIAL"
          else
            row UNITY_LICENSE "Unity license file (.ulf contents)" "$UNITY_LICENSE"
          fi
          row UNITY_EMAIL "Unity account email" "$UNITY_EMAIL"
          row UNITY_PASSWORD "Unity account password" "$UNITY_PASSWORD"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version must look like 1.2 or 1.2.3 (got '$INPUT_VERSION')."
            missing=$((missing+1))
          fi
          if [ "$missing" -gt 0 ]; then
            echo "**Not ready.** Add the Unity secrets (docs/guides/ios-sideload.md, step 1), then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Ready — starting unsigned build $BUILD_NUMBER." >> "$GITHUB_STEP_SUMMARY"
      # When a secret is missing, look for it in the usual wrong places. Only checks whether these
      # specific names are set; no secret value is printed.
      - name: Where did the secrets go?
        if: failure()
        env:
          VAR_UNITY_LICENSE: ${{ vars.UNITY_LICENSE }}
          VAR_UNITY_EMAIL: ${{ vars.UNITY_EMAIL }}
          VAR_UNITY_PASSWORD: ${{ vars.UNITY_PASSWORD }}
          VAR_UNITY_SERIAL: ${{ vars.UNITY_SERIAL }}
          ALT_UNITY_LICENCE: ${{ secrets.UNITY_LICENCE }}
          ALT_UNITY_LICENSE_FILE: ${{ secrets.UNITY_LICENSE_FILE }}
          ALT_UNITY_ULF: ${{ secrets.UNITY_ULF }}
          ALT_UNITY_USERNAME: ${{ secrets.UNITY_USERNAME }}
          ALT_UNITY_USER: ${{ secrets.UNITY_USER }}
          ALT_UNITY_PASS: ${{ secrets.UNITY_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          found=()
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD UNITY_SERIAL; do
            v="VAR_$name"
            if [ -n "${!v}" ]; then
              found+=("\`$name\` is on the **Variables** tab")
              echo "::error title=$name is a Variable::$name was saved on the Variables tab. Delete it there and add it on the Secrets tab (variables are stored in plain text)."
            fi
          done
          for name in UNITY_LICENCE UNITY_LICENSE_FILE UNITY_ULF UNITY_USERNAME UNITY_USER UNITY_PASS; do
            v="ALT_$name"
            if [ -n "${!v}" ]; then
              found+=("a secret is named \`$name\`")
              echo "::error title=Secret name mismatch::Found a secret named $name; the build needs exactly UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD."
            fi
          done
          # Public repository: the default token can list Environments.
          envs="" envs_checked="and the repository has no Environments"
          if json=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                      "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments" 2>/dev/null); then
            envs=$(jq -r '.environments[]?.name' <<< "$json" | paste -sd, | sed 's/,/, /g')
          else
            envs_checked="(Environments could not be listed)"
          fi
          if [ -n "$envs" ]; then
            found+=("this repository has Environments ($envs); secrets inside an Environment are not used by this build")
            echo "::warning title=Environments exist::If you put the Unity secrets inside an Environment ($envs), add them as Repository secrets instead."
          fi
          {
            echo "### Where the secrets might be"
            echo ""
            if [ ${#found[@]} -gt 0 ]; then printf -- '- %s\n' "${found[@]}"; else
              echo "- Not on the Variables tab, not under a common misspelling $envs_checked."
              echo "- That leaves **Codespaces** or **Dependabot** secrets, or a different repository."
            fi
            echo ""
            echo "They must be at **this repository → Settings → Secrets and variables → Actions → Secrets tab →"
            echo "New repository secret**, named exactly \`UNITY_LICENSE\`, \`UNITY_EMAIL\`, \`UNITY_PASSWORD\`."
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "${found[@]:-nothing found in the usual wrong places (likely Codespaces/Dependabot secrets or another repository)}"

  xcode-project:
    name: Unity → Xcode project
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space for the Unity iOS image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-ios-${{ hashFiles('game/Packages/manifest.json', 'game/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-ios-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: game
          targetPlatform: iOS
          buildName: Kindling
          buildMethod: Kindling.Editor.Build.KindlingBuild.CiBuildIos
          versioning: None
          # No bundle id or team: the sideloading tool re-signs the app with your Apple ID.
          customParameters: >-
            -kindlingVersion ${{ github.event.inputs.version }}
            -kindlingBuild ${{ env.BUILD_NUMBER }}
      # Tar keeps executable bits on Unity's build scripts (artifacts drop file permissions).
      - name: Package Xcode project
        run: tar -czf xcode-project.tgz -C build/iOS/Kindling .
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project-unsigned
          path: xcode-project.tgz
          retention-days: 3

  ipa:
    name: Compile unsigned .ipa
    needs: xcode-project
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project-unsigned
          path: build
      - name: Unpack Xcode project
        working-directory: build
        run: mkdir xcode && tar -xzf xcode-project.tgz -C xcode && ls xcode
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Compile without code signing
        working-directory: build
        run: |
          set -o pipefail
          project=xcode/Unity-iPhone.xcodeproj
          schemes=$(xcodebuild -list -project "$project")
          echo "$schemes"
          common=(-project "$project" -configuration Release -sdk iphoneos
                  CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="")
          if sed -n '/Schemes:/,$p' <<< "$schemes" | grep -Eq '^[[:space:]]*Unity-iPhone$'; then
            xcodebuild "${common[@]}" -scheme Unity-iPhone -destination 'generic/platform=iOS' -derivedDataPath dd build | tail -n 60
            products=dd/Build/Products/Release-iphoneos
          else
            # No shared scheme: build the app target (it builds UnityFramework as a dependency).
            xcodebuild "${common[@]}" -target Unity-iPhone SYMROOT="$PWD/sym" build | tail -n 60
            products=sym/Release-iphoneos
          fi
          app=$(find "$products" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$app" ]; then echo "::error::No .app was produced."; ls -R "$products" | head -50; exit 1; fi
          echo "Built $app"
          mkdir -p ipa/Payload
          cp -R "$app" ipa/Payload/
          (cd ipa && zip -qry ../Kindling-unsigned.ipa Payload)
          ls -lh Kindling-unsigned.ipa
          {
            echo "## Unsigned .ipa ready"
            echo ""
            echo "Download **kindling-unsigned-${{ github.event.inputs.version }}-${{ env.BUILD_NUMBER }}** below, unzip it, and install"
            echo "\`Kindling-unsigned.ipa\` with your Apple ID: docs/guides/ios-sideload.md."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kindling-unsigned-${{ github.event.inputs.version }}-${{ env.BUILD_NUMBER }}
          path: build/Kindling-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
