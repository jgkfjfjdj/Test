name: ci-sim

on:
  push:
    paths:
      [
        'game/Assets/Kindling/Runtime/**',
        'game/Assets/Kindling/Tests/**',
        'sim/**',
        '.github/workflows/ci-sim.yml',
      ]
  pull_request:
    paths:
      [
        'game/Assets/Kindling/Runtime/**',
        'game/Assets/Kindling/Tests/**',
        'sim/**',
        '.github/workflows/ci-sim.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pure C# tests (dotnet, no Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test sim/Kindling.Sim.Tests --configuration Release --logger "console;verbosity=normal"
      - name: Build dev server and bots
        run: |
          dotnet build sim/Kindling.DevServer --configuration Release
          dotnet build sim/Kindling.Bots --configuration Release
      - name: Real-UDP smoke test (dev server + 20 bots, 15 s)
        run: |
          dotnet sim/Kindling.DevServer/bin/Release/net8.0/Kindling.DevServer.dll --duration 30 --stats-interval 5 > server.log 2>&1 &
          sleep 3
          dotnet sim/Kindling.Bots/bin/Release/net8.0/Kindling.Bots.dll --count 20 --duration 15
          wait
          grep -q "oversize=0" server.log
          if grep -q "Unhandled exception" server.log; then cat server.log; exit 1; fi
          grep '\[stats\]' server.log
