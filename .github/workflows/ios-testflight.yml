name: ios-testflight

# Builds the iPhone app and delivers it through TestFlight — no Mac needed on your side:
#   1. Unity (Linux runner, GameCI) exports the Xcode project.
#   2. A macOS runner signs it (fastlane match), builds Kindling.ipa and uploads it to TestFlight.
# Run it from GitHub → Actions → ios-testflight → "Run workflow", or push a tag like client/v0.1.0.
# Setup (accounts + secrets): docs/guides/ios-testflight.md

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version shown to players (CFBundleShortVersionString)'
        default: '0.1.0'
        required: true
      upload:
        description: 'Upload the .ipa to TestFlight'
        type: boolean
        default: true
  push:
    tags: ['client/v*']

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  # CFBundleVersion must increase with every upload to App Store Connect.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  preflight:
    name: Check accounts and secrets
    runs-on: ubuntu-latest
    steps:
      - name: Secrets checklist
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          missing=0
          {
            echo "## iOS build prerequisites"
            echo ""
            echo "| Secret | Purpose | Status |"
            echo "|--------|---------|--------|"
          } >> "$GITHUB_STEP_SUMMARY"
          row() { # name purpose value
            if [ -n "$3" ]; then status="✅ set"; else status="❌ missing"; missing=$((missing+1)); echo "::error title=Missing secret::$1 — $2"; fi
            echo "| \`$1\` | $2 | $status |" >> "$GITHUB_STEP_SUMMARY"
          }
          if [ -n "$UNITY_SERIAL" ]; then
            row UNITY_SERIAL "Unity Pro serial" "$UNITY_SERIAL"
          else
            row UNITY_LICENSE "Unity license file (.ulf contents)" "$UNITY_LICENSE"
          fi
          row UNITY_EMAIL "Unity account email" "$UNITY_EMAIL"
          row UNITY_PASSWORD "Unity account password" "$UNITY_PASSWORD"
          row APPLE_TEAM_ID "Apple Developer Team ID" "$APPLE_TEAM_ID"
          row IOS_BUNDLE_ID "App bundle id (registered in your Apple account)" "$IOS_BUNDLE_ID"
          row ASC_KEY_ID "App Store Connect API key id" "$ASC_KEY_ID"
          row ASC_ISSUER_ID "App Store Connect issuer id" "$ASC_ISSUER_ID"
          row ASC_KEY_P8 "App Store Connect API key (.p8 file contents)" "$ASC_KEY_P8"
          row MATCH_PASSWORD "Encryption password for signing certificates" "$MATCH_PASSWORD"
          row MATCH_GIT_URL "Private repo that stores the encrypted certificates" "$MATCH_GIT_URL"
          row MATCH_GIT_USERNAME "GitHub username that owns the certificates repo" "$MATCH_GIT_USERNAME"
          row MATCH_GIT_TOKEN "GitHub token with access to the certificates repo" "$MATCH_GIT_TOKEN"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$missing" -gt 0 ]; then
            echo "**$missing secret(s) missing.** Follow docs/guides/ios-testflight.md, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "All prerequisites are set — starting build $BUILD_NUMBER." >> "$GITHUB_STEP_SUMMARY"

  xcode-project:
    name: Unity → Xcode project
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve app version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#client/v}}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version must look like 1.2 or 1.2.3 (got '$version')."; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Free disk space for the Unity iOS image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: game/Library
          key: Library-ios-${{ hashFiles('game/Packages/manifest.json', 'game/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-ios-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: game
          targetPlatform: iOS
          buildName: Kindling
          buildMethod: Kindling.Editor.Build.KindlingBuild.CiBuildIos
          versioning: None
          customParameters: >-
            -kindlingVersion ${{ env.APP_VERSION }}
            -kindlingBuild ${{ env.BUILD_NUMBER }}
            -bundleId ${{ secrets.IOS_BUNDLE_ID }}
            -appleTeamId ${{ secrets.APPLE_TEAM_ID }}
      # Tar keeps executable bits on Unity's build scripts (artifacts drop file permissions).
      - name: Package Xcode project
        run: tar -czf xcode-project.tgz -C build/iOS/Kindling .
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tgz
          retention-days: 3

  ipa:
    name: Sign, build .ipa, upload to TestFlight
    needs: xcode-project
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: game/BuildConfigs/iOS
    steps:
      - uses: actions/checkout@v4
      - name: Resolve app version
        working-directory: .
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#client/v}}"
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version must look like 1.2 or 1.2.3 (got '$version')."; exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: ${{ github.workspace }}/build
      - name: Unpack Xcode project
        working-directory: ${{ github.workspace }}/build
        run: mkdir xcode && tar -xzf xcode-project.tgz -C xcode && ls xcode
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: game/BuildConfigs/iOS
      - name: fastlane release
        env:
          XCODE_PROJECT: ${{ github.workspace }}/build/xcode/Unity-iPhone.xcodeproj
          OUTPUT_DIR: ${{ github.workspace }}/output
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_USERNAME: ${{ secrets.MATCH_GIT_USERNAME }}
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
          UPLOAD_TO_TESTFLIGHT: ${{ github.event_name == 'push' || github.event.inputs.upload == 'true' }}
          TESTFLIGHT_CHANGELOG: 'KINDLING ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}) — technical test build, commit ${{ github.sha }}'
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: |
          # fastlane match authenticates to the certificates repo with base64("user:token").
          auth=$(printf '%s:%s' "$MATCH_GIT_USERNAME" "$MATCH_GIT_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          MATCH_GIT_BASIC_AUTHORIZATION="$auth" bundle exec fastlane ios release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kindling-ios-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: |
            ${{ github.workspace }}/output/*.ipa
            ${{ github.workspace }}/output/*.dSYM.zip
          if-no-files-found: warn
          retention-days: 14
